<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Song Database</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12141c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12141c;--ink-2:#2a2c33;--paper:#eedd95;--paper-2:#e0d08c;
  --gold:#b4b9f3;--rose:#fd9f1c;--teal:#272d82;--line:rgba(18,20,28,0.15);
  --text-on-ink:#eedd95;--text-dim:rgba(238,221,149,0.6);
  --on-paper:#12141c;--on-ink:#eedd95;
  --on-paper-rgb:18,20,28;--on-ink-rgb:238,221,149;--field-bg:#ffffff;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--ink);background-image:radial-gradient(circle at 15% 20%,rgba(253,159,28,0.10),transparent 40%),radial-gradient(circle at 85% 75%,rgba(39,45,130,0.08),transparent 40%);color:var(--text-on-ink);font-family:'Space Grotesk',sans-serif;min-height:100vh;}
.wrap{max-width:1100px;margin:0 auto;padding:40px 24px 100px;}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px;margin-bottom:36px;border-bottom:1px solid rgba(238,221,149,0.15);padding-bottom:24px;}
h1{font-family:'Fraunces',serif;font-weight:700;font-style:italic;font-size:clamp(32px,5vw,52px);margin:0;letter-spacing:-0.5px;color:var(--on-ink);}
h1 .side-a{font-family:'IBM Plex Mono',monospace;font-style:normal;font-size:13px;display:block;letter-spacing:3px;color:var(--gold);margin-bottom:6px;}
.stats{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);text-align:right;line-height:1.6;}
.stats b{color:var(--on-ink);font-weight:500;}
.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
input,select{font-family:'Space Grotesk',sans-serif;background:var(--ink-2);border:1px solid rgba(238,221,149,0.32);color:var(--on-ink);padding:10px 14px;border-radius:8px;font-size:14px;}
input::placeholder{color:rgba(238,221,149,0.62);}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;}
select{cursor:pointer;}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px;align-items:center;}
#search{flex:1;min-width:180px;}
.btn{font-family:'Space Grotesk',sans-serif;background:var(--gold);color:var(--ink);border:none;font-weight:600;padding:11px 20px;border-radius:8px;cursor:pointer;font-size:14px;transition:transform .15s ease,background .15s ease;}
.btn:hover{background:#eab654;transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn.secondary{background:transparent;color:var(--on-ink);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);}
.btn.secondary:hover{background:color-mix(in srgb,var(--gold) 14%,transparent);}
.btn.danger{color:#f2b6c2;border-color:rgba(214,83,109,0.5);}
.btn.danger:hover{background:rgba(214,83,109,0.14);border-color:#d6536d;}
.btn.small{padding:7px 14px;font-size:12px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;}
.card{position:relative;background:var(--paper);color:var(--on-paper);border-radius:10px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 20px rgba(0,0,0,0.25);transition:transform .18s ease,box-shadow .18s ease;}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(0,0,0,0.32);}
.card::after{content:"";position:absolute;top:0;right:14px;bottom:0;width:0;border-right:2px dashed rgba(var(--on-paper-rgb),0.18);}
.card-top{display:flex;gap:12px;align-items:flex-start;padding-right:26px;}
.title-stack{flex:1;min-width:0;}
.track-title{font-family:'Fraunces',serif;font-weight:700;font-size:20px;line-height:1.2;margin:0 0 2px;}
.track-artist{font-size:14px;color:rgba(var(--on-paper-rgb),0.9);margin:0;}
.cover-thumb{width:56px;height:56px;border-radius:6px;object-fit:cover;flex-shrink:0;border:1px solid rgba(var(--on-paper-rgb),0.15);box-shadow:0 2px 6px rgba(0,0,0,0.2);}
.cover-fallback{width:56px;height:56px;border-radius:6px;flex-shrink:0;background:linear-gradient(135deg,#e0a638,#b8892f);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:22px;}
.meta-row{font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(var(--on-paper-rgb),0.82);display:flex;flex-wrap:wrap;gap:6px 10px;padding-right:26px;}
.meta-row span{white-space:nowrap;}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
.tag{background:rgba(var(--on-paper-rgb),0.08);border:1px solid rgba(var(--on-paper-rgb),0.12);color:var(--ink);font-size:11px;padding:3px 9px;border-radius:20px;font-family:'IBM Plex Mono',monospace;}
.notes{font-size:13px;line-height:1.5;color:rgba(var(--on-paper-rgb),0.95);border-left:2px solid var(--teal);padding-left:10px;margin:4px 0 0;font-style:italic;}
.card-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}
.card-link{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.5px;text-decoration:none;padding:4px 8px;border-radius:5px;border:1px solid rgba(var(--on-paper-rgb),0.2);color:rgba(var(--on-paper-rgb),0.88);}
.card-link:hover{border-color:var(--teal);color:var(--teal);}
.card-actions{display:flex;gap:10px;margin-top:auto;padding-top:10px;border-top:1px solid rgba(var(--on-paper-rgb),0.1);}
.card-actions button{background:none;border:none;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.5px;cursor:pointer;color:rgba(var(--on-paper-rgb),0.95);font-weight:600;padding:4px 0;}
.card-actions button:hover{color:var(--on-paper);text-decoration:underline;}
.card-actions .del:hover{color:var(--rose);}
.empty{text-align:center;padding:80px 20px;color:var(--text-dim);}
.empty h2{font-family:'Fraunces',serif;font-style:italic;color:var(--on-ink);font-size:26px;margin-bottom:8px;}
.overlay{position:fixed;inset:0;background:rgba(12,11,20,0.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
.overlay.open{display:flex;}
.modal{background:var(--paper);color:var(--on-paper);width:100%;max-width:580px;max-height:88vh;overflow-y:auto;border-radius:14px;padding:28px;}
.modal h3{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:24px;margin:0 0 20px;}
.field{margin-bottom:14px;}
.field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.5px;color:rgba(var(--on-paper-rgb),0.85);margin-bottom:5px;text-transform:uppercase;}
.field input,.field textarea{width:100%;background:var(--field-bg);border:1px solid rgba(var(--on-paper-rgb),0.2);color:var(--on-paper);padding:9px 12px;border-radius:7px;font-family:'Space Grotesk',sans-serif;font-size:14px;}
.field textarea{resize:vertical;min-height:60px;}
.field input:focus,.field textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
.modal-actions button{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;padding:10px 18px;border-radius:8px;cursor:pointer;border:none;}
.btn-cancel{background:none;color:rgba(var(--on-paper-rgb),0.85);}
.btn-cancel:hover{text-decoration:underline;}
.btn-save{background:var(--ink);color:var(--on-ink);}
.btn-save:hover{background:var(--ink-2);}
.search-itunes{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.5px;background:var(--teal);color:#fff;border:none;padding:7px 12px;border-radius:7px;cursor:pointer;margin-bottom:14px;}
.search-itunes:hover{filter:brightness(1.15);}
.itunes-results{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;margin-bottom:14px;border:1px solid rgba(var(--on-paper-rgb),0.15);border-radius:8px;padding:8px;display:none;}
.itunes-results.open{display:flex;}
.itunes-result{display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px;cursor:pointer;border:1px solid transparent;font-family:inherit;background:none;width:100%;text-align:left;color:var(--on-paper);}
.itunes-result:hover{border-color:var(--teal);background:rgba(90,155,155,0.08);}
.itunes-result img{width:40px;height:40px;border-radius:5px;object-fit:cover;flex-shrink:0;}
.itunes-result-info{flex:1;min-width:0;}
.itunes-result-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.itunes-result-artist{font-size:11px;color:rgba(var(--on-paper-rgb),0.75);}
.stream-links{display:flex;flex-direction:column;gap:8px;}
.stream-row{display:flex;gap:8px;align-items:center;}
.stream-row label{margin:0;font-size:11px;width:50px;flex-shrink:0;}
.stream-row input{flex:1;}
.toast-wrap{position:fixed;top:16px;right:16px;z-index:3000;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:var(--text-on-ink);border:1px solid var(--gold);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer;max-width:340px;animation:toastIn .25s ease;}
.toast-icon{font-size:20px;}
.toast-body b{font-size:13px;font-weight:600;line-height:1.4;}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
@media(max-width:480px){.three-col{grid-template-columns:1fr;}header{flex-direction:column;align-items:flex-start;}.stats{text-align:left;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="side-a">SONG FACTS DATABASE</span>Song Database</h1>
    <div class="stats" id="stats"></div>
    <div class="header-actions">
      <button class="btn small secondary" id="exportBtn">Export JSON</button>
      <button class="btn small secondary" id="importBtn">Import JSON</button>
      <input type="file" id="importFile" accept=".json" style="display:none;">
    </div>
  </header>
  <div class="controls">
    <input type="text" id="search" placeholder="Search title, artist, album...">
    <select id="filterGenre"><option value="">All genres</option></select>
    <select id="sortBy">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="title">Title (A-Z)</option>
      <option value="artist">Artist (A-Z)</option>
      <option value="year-desc">Year (newest)</option>
      <option value="year-asc">Year (oldest)</option>
    </select>
    <button class="btn" id="addBtn">+ Add Song</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState">
    <h2>No songs yet</h2>
    <p>Add the first song to start your database.</p>
  </div>
</div>

<div class="overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Add Song</h3>
    <button class="search-itunes" id="itunesSearchBtn" type="button">Search iTunes to auto-fill</button>
    <div class="itunes-results" id="itunesResults"></div>
    <div class="field"><label>Title *</label><input id="fTitle" required></div>
    <div class="field"><label>Artist(s)</label><input id="fArtists" placeholder="Comma-separated"></div>
    <div class="field"><label>Album</label><input id="fAlbum"></div>
    <div class="three-col">
      <div class="field"><label>Year</label><input id="fYear" placeholder="e.g. 2023"></div>
      <div class="field"><label>Genre(s)</label><input id="fGenres" placeholder="Comma-separated"></div>
      <div class="field"><label>Record Label</label><input id="fLabel"></div>
    </div>
    <div class="three-col">
      <div class="field"><label>Track #</label><input id="fTrackNum" type="number" min="1"></div>
      <div class="field"><label>Duration</label><input id="fDuration" placeholder="e.g. 4:32"></div>
      <div class="field"><label>BPM</label><input id="fBpm" placeholder="e.g. 120"></div>
    </div>
    <div class="three-col">
      <div class="field"><label>Key</label><input id="fKey" placeholder="e.g. C major"></div>
      <div class="field"><label>Producer</label><input id="fProducer"></div>
      <div class="field"><label>Songwriter(s)</label><input id="fSongwriters" placeholder="Comma-separated"></div>
    </div>
    <div class="field"><label>Tags</label><input id="fTags" placeholder="Comma-separated (e.g. live, acoustic, remix)"></div>
    <div class="field">
      <label>Streaming Links</label>
      <div class="stream-links">
        <div class="stream-row"><label>Spotify</label><input id="fSpotify" placeholder="https://open.spotify.com/..."></div>
        <div class="stream-row"><label>Apple</label><input id="fApple" placeholder="https://music.apple.com/..."></div>
      </div>
    </div>
    <div class="field"><label>Cover Art URL</label><input id="fCover" placeholder="https://..."></div>
    <div class="field"><label>Notes / Facts</label><textarea id="fNotes" placeholder="Any additional facts about this song..."></textarea></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel" type="button">Cancel</button>
      <button class="btn-save" id="modalSave" type="button">Save</button>
    </div>
  </div>
</div>

<div class="overlay" id="deleteOverlay">
  <div class="modal" style="max-width:400px;">
    <h3>Delete Song?</h3>
    <p style="font-size:14px;color:rgba(var(--on-paper-rgb),0.85);margin:0 0 18px;">This can't be undone.</p>
    <div class="modal-actions">
      <button class="btn-cancel" id="deleteCancel" type="button">Cancel</button>
      <button class="btn-save" id="deleteConfirm" type="button" style="background:#d6536d;">Delete</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
</body>
<script>
const STORAGE_KEY = 'songdb-entries';
let songs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let editingId = null;
let deletingId = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(songs)); }

function toast(msg, icon){
  const w = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '<span class="toast-icon">' + (icon||'&#10003;') + '</span><span class="toast-body"><b>' + msg + '</b></span>';
  w.appendChild(t);
  t.onclick = function(){ t.remove(); };
  setTimeout(function(){ if(t.parentNode) t.remove(); }, 3000);
}

function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function getGenres(){
  var g = new Set();
  songs.forEach(function(s){ (s.genres||[]).forEach(function(x){ g.add(x); }); });
  return Array.from(g).sort();
}

function renderGenreFilter(){
  var sel = document.getElementById('filterGenre');
  var cur = sel.value;
  var genres = getGenres();
  sel.innerHTML = '<option value="">All genres</option>';
  genres.forEach(function(g){
    var o = document.createElement('option');
    o.value = g; o.textContent = g;
    sel.appendChild(o);
  });
  sel.value = cur;
}

function renderStats(){
  document.getElementById('stats').innerHTML = '<b>' + songs.length + '</b> song' + (songs.length !== 1 ? 's' : '') + ' in database';
}

function renderGrid(){
  var q = document.getElementById('search').value.toLowerCase();
  var genre = document.getElementById('filterGenre').value;
  var sort = document.getElementById('sortBy').value;

  var filtered = songs.filter(function(s){
    var matchSearch = !q ||
      (s.title||'').toLowerCase().indexOf(q) !== -1 ||
      (s.artists||[]).join(',').toLowerCase().indexOf(q) !== -1 ||
      (s.album||'').toLowerCase().indexOf(q) !== -1;
    var matchGenre = !genre || (s.genres||[]).indexOf(genre) !== -1;
    return matchSearch && matchGenre;
  });

  filtered.sort(function(a,b){
    switch(sort){
      case 'newest': return (b.createdAt||0)-(a.createdAt||0);
      case 'oldest': return (a.createdAt||0)-(b.createdAt||0);
      case 'title': return (a.title||'').localeCompare(b.title||'');
      case 'artist': return (a.artists||[]).join(',').localeCompare((b.artists||[]).join(','));
      case 'year-desc': return (b.year||'').localeCompare(a.year||'');
      case 'year-asc': return (a.year||'').localeCompare(b.year||'');
      default: return 0;
    }
  });

  var grid = document.getElementById('grid');
  var empty = document.getElementById('emptyState');

  if(filtered.length === 0){
    grid.innerHTML = '';
    empty.style.display = 'block';
    empty.querySelector('p').textContent = songs.length === 0 ?
      'Add the first song to start your database.' :
      'No songs match your search.';
    return;
  }

  empty.style.display = 'none';
  grid.innerHTML = filtered.map(function(s){
    var artists = (s.artists||[]).join(', ') || 'Unknown artist';
    var genres = (s.genres||[]).join(', ');
    var tags = s.tags || [];
    var meta = [];
    if(s.album) meta.push(s.album);
    if(s.year) meta.push(s.year);
    if(genres) meta.push(genres);
    if(s.trackNumber) meta.push('#' + s.trackNumber);
    if(s.duration) meta.push(s.duration);
    if(s.key) meta.push(s.key);
    if(s.bpm) meta.push(s.bpm + ' BPM');

    var streamLinks = [];
    if(s.streamingLinks){
      if(s.streamingLinks.spotify) streamLinks.push({label:'Spotify', url:s.streamingLinks.spotify});
      if(s.streamingLinks.apple) streamLinks.push({label:'Apple', url:s.streamingLinks.apple});
    }

    var coverHTML = s.coverArt ?
      '<img class="cover-thumb" src="' + esc(s.coverArt) + '" alt="">' :
      '<div class="cover-fallback">' + (s.title||'?')[0].toUpperCase() + '</div>';

    var html = '<div class="card"><div class="card-top">' + coverHTML +
      '<div class="title-stack"><p class="track-title">' + esc(s.title||'Untitled') + '</p>' +
      '<p class="track-artist">' + esc(artists) + '</p></div></div>';

    if(meta.length) html += '<div class="meta-row">' + meta.map(function(m){ return '<span>' + esc(m) + '</span>'; }).join('') + '</div>';
    if(s.producer) html += '<div class="meta-row"><span>Prod. by ' + esc(s.producer) + '</span></div>';
    if(s.songwriters) html += '<div class="meta-row"><span>Written by ' + esc(s.songwriters) + '</span></div>';
    if(s.recordLabel) html += '<div class="meta-row"><span>' + esc(s.recordLabel) + '</span></div>';
    if(tags.length) html += '<div class="tags">' + tags.map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>';
    if(streamLinks.length) html += '<div class="card-links">' + streamLinks.map(function(l){ return '<a class="card-link" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + l.label + '</a>'; }).join('') + '</div>';
    if(s.notes) html += '<div class="notes">' + esc(s.notes) + '</div>';

    html += '<div class="card-actions">' +
      '<button onclick="editSong(\'' + s.id + '\')">Edit</button>' +
      '<button class="del" onclick="confirmDelete(\'' + s.id + '\')">Delete</button></div></div>';

    return html;
  }).join('');
}
function openModal(song){
  editingId = song ? song.id : null;
  document.getElementById('modalTitle').textContent = song ? 'Edit Song' : 'Add Song';
  document.getElementById('fTitle').value = song ? (song.title||'') : '';
  document.getElementById('fArtists').value = song ? (song.artists||[]).join(', ') : '';
  document.getElementById('fAlbum').value = song ? (song.album||'') : '';
  document.getElementById('fYear').value = song ? (song.year||'') : '';
  document.getElementById('fGenres').value = song ? (song.genres||[]).join(', ') : '';
  document.getElementById('fLabel').value = song ? (song.recordLabel||'') : '';
  document.getElementById('fTrackNum').value = song ? (song.trackNumber||'') : '';
  document.getElementById('fDuration').value = song ? (song.duration||'') : '';
  document.getElementById('fBpm').value = song ? (song.bpm||'') : '';
  document.getElementById('fKey').value = song ? (song.key||'') : '';
  document.getElementById('fProducer').value = song ? (song.producer||'') : '';
  document.getElementById('fSongwriters').value = song ? (song.songwriters||'') : '';
  document.getElementById('fTags').value = song ? (song.tags||[]).join(', ') : '';
  document.getElementById('fSpotify').value = song && song.streamingLinks ? (song.streamingLinks.spotify||'') : '';
  document.getElementById('fApple').value = song && song.streamingLinks ? (song.streamingLinks.apple||'') : '';
  document.getElementById('fCover').value = song ? (song.coverArt||'') : '';
  document.getElementById('fNotes').value = song ? (song.notes||'') : '';
  document.getElementById('itunesResults').classList.remove('open');
  document.getElementById('itunesResults').innerHTML = '';
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('fTitle').focus();
}

function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }

function splitCsv(v){ return v.split(',').map(function(x){ return x.trim(); }).filter(Boolean); }

function handleSave(){
  var title = document.getElementById('fTitle').value.trim();
  if(!title){ toast('Title is required', '&#9888;'); return; }

  var data = {
    title: title,
    artists: splitCsv(document.getElementById('fArtists').value),
    album: document.getElementById('fAlbum').value.trim(),
    year: document.getElementById('fYear').value.trim(),
    genres: splitCsv(document.getElementById('fGenres').value),
    recordLabel: document.getElementById('fLabel').value.trim(),
    trackNumber: parseInt(document.getElementById('fTrackNum').value) || null,
    duration: document.getElementById('fDuration').value.trim(),
    bpm: document.getElementById('fBpm').value.trim(),
    key: document.getElementById('fKey').value.trim(),
    producer: document.getElementById('fProducer').value.trim(),
    songwriters: document.getElementById('fSongwriters').value.trim(),
    tags: splitCsv(document.getElementById('fTags').value),
    coverArt: document.getElementById('fCover').value.trim() || null,
    notes: document.getElementById('fNotes').value.trim(),
    streamingLinks: {
      spotify: document.getElementById('fSpotify').value.trim() || null,
      apple: document.getElementById('fApple').value.trim() || null
    }
  };

  if(editingId){
    var idx = songs.findIndex(function(s){ return s.id === editingId; });
    if(idx !== -1){
      data.id = editingId;
      data.createdAt = songs[idx].createdAt;
      songs[idx] = data;
    }
    toast('Song updated');
  } else {
    data.id = uid();
    data.createdAt = Date.now();
    songs.unshift(data);
    toast('Song added');
  }

  save();
  renderGenreFilter();
  renderStats();
  renderGrid();
  closeModal();
}

function editSong(id){
  var s = songs.find(function(x){ return x.id === id; });
  if(s) openModal(s);
}

function confirmDelete(id){ deletingId = id; document.getElementById('deleteOverlay').classList.add('open'); }
function cancelDelete(){ deletingId = null; document.getElementById('deleteOverlay').classList.remove('open'); }

function handleDelete(){
  if(!deletingId) return;
  songs = songs.filter(function(s){ return s.id !== deletingId; });
  save(); renderGenreFilter(); renderStats(); renderGrid();
  cancelDelete();
  toast('Song deleted');
}
function searchiTunes(){
  var q = document.getElementById('fTitle').value.trim();
  var a = document.getElementById('fArtists').value.trim();
  if(a) q += ' ' + a;
  if(!q){ toast('Type a title or artist first', '&#9888;'); return; }

  var box = document.getElementById('itunesResults');
  box.innerHTML = '<div style="padding:8px;font-size:12px;opacity:0.6;">Searching...</div>';
  box.classList.add('open');

  var script = document.createElement('script');
  script.src = 'https://itunes.apple.com/search?term=' + encodeURIComponent(q) + '&media=music&entity=song&limit=8&callback=handleiTunesResults';
  script.onerror = function(){
    box.innerHTML = '<div style="padding:8px;font-size:12px;opacity:0.6;">Search failed. Try again.</div>';
  };
  document.body.appendChild(script);
}

function handleiTunesResults(data){
  var box = document.getElementById('itunesResults');
  if(!data || !data.results || data.results.length === 0){
    box.innerHTML = '<div style="padding:8px;font-size:12px;opacity:0.6;">No results found.</div>';
    return;
  }
  box.innerHTML = data.results.map(function(r, i){
    return '<button type="button" class="itunes-result" onclick="pickiTunesResult(' + i + ')">' +
      '<img src="' + (r.artworkUrl100||'') + '" alt="">' +
      '<div class="itunes-result-info"><div class="itunes-result-title">' + esc(r.trackName||'') + '</div>' +
      '<div class="itunes-result-artist">' + esc(r.artistName||'') + ' &mdash; ' + esc(r.collectionName||'') + '</div></div></button>';
  }).join('');
  window._itunesData = data.results;
}

function pickiTunesResult(i){
  var r = window._itunesData && window._itunesData[i];
  if(!r) return;
  document.getElementById('fTitle').value = r.trackName || '';
  document.getElementById('fArtists').value = r.artistName || '';
  document.getElementById('fAlbum').value = r.collectionName || '';
  document.getElementById('fYear').value = r.releaseDate ? r.releaseDate.substring(0, 4) : '';
  document.getElementById('fGenres').value = r.primaryGenreName || '';
  document.getElementById('fTrackNum').value = r.trackNumber || '';
  if(r.trackTimeMillis){
    var sec = Math.round(r.trackTimeMillis / 1000);
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    document.getElementById('fDuration').value = m + ':' + (s < 10 ? '0' : '') + s;
  }
  document.getElementById('fCover').value = r.artworkUrl100 ? r.artworkUrl100.replace('100x100', '600x600') : '';
  document.getElementById('itunesResults').classList.remove('open');
  toast('Fields auto-filled from iTunes');
}

function exportJSON(){
  var blob = new Blob([JSON.stringify(songs, null, 2)], {type: 'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'songdb-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Database exported');
}

function importJSON(){
  document.getElementById('importFile').click();
}

function handleImport(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try {
      var data = JSON.parse(ev.target.result);
      if(!Array.isArray(data)){ toast('Invalid file format', '&#9888;'); return; }
      var count = 0;
      data.forEach(function(s){
        if(s.title){
          if(!s.id) s.id = uid();
          if(!s.createdAt) s.createdAt = Date.now();
          songs.push(s);
          count++;
        }
      });
      save(); renderGenreFilter(); renderStats(); renderGrid();
      toast('Imported ' + count + ' song' + (count !== 1 ? 's' : ''));
    } catch(err){
      toast('Failed to parse file', '&#9888;');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}
document.getElementById('addBtn').onclick = function(){ openModal(null); };
document.getElementById('modalSave').onclick = handleSave;
document.getElementById('modalCancel').onclick = closeModal;
document.getElementById('deleteConfirm').onclick = handleDelete;
document.getElementById('deleteCancel').onclick = cancelDelete;
document.getElementById('exportBtn').onclick = exportJSON;
document.getElementById('importBtn').onclick = importJSON;
document.getElementById('importFile').onchange = handleImport;
document.getElementById('itunesSearchBtn').onclick = searchiTunes;
document.getElementById('search').oninput = renderGrid;
document.getElementById('filterGenre').onchange = renderGrid;
document.getElementById('sortBy').onchange = renderGrid;

document.getElementById('modalOverlay').onclick = function(e){
  if(e.target === this) closeModal();
};
document.getElementById('deleteOverlay').onclick = function(e){
  if(e.target === this) cancelDelete();
};

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    closeModal();
    cancelDelete();
  }
});

renderGenreFilter();
renderStats();
renderGrid();
</script>
</html>
